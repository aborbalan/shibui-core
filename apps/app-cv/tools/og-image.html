<!DOCTYPE html>
<!--
  Plantilla de la imagen Open Graph (1200×630) del CV.
  Autónoma (sin fuentes de red) para rasterizar con Chrome headless:
    chrome --headless --window-size=1200,630 --screenshot=og-image.png og-image.html
  Estética Shibui: papel washi + sello hanko kaki + tinta oscura.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --washi: #faf7f4;
        --washi-2: #f1ebe3;
        --ink: #2b2622;
        --ink-soft: #6b6258;
        --kaki: #d97234;
        --kaki-deep: #b85a1e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(900px 500px at 88% -10%, rgba(217, 114, 52, 0.16), transparent 60%),
          linear-gradient(135deg, var(--washi) 0%, var(--washi-2) 100%);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 96px;
      }
      /* Sello hanko (igual lenguaje que el favicon) */
      .seal {
        flex: 0 0 auto;
        width: 188px;
        height: 188px;
        border-radius: 38px;
        background: linear-gradient(180deg, var(--kaki), var(--kaki-deep));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 48px rgba(184, 90, 30, 0.32);
        position: relative;
      }
      .seal::after {
        content: '';
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(250, 247, 244, 0.4);
        border-radius: 24px;
      }
      .seal span {
        font-family: 'Yu Mincho', 'MS Mincho', 'Hiragino Mincho ProN', serif;
        font-size: 118px;
        font-weight: 600;
        color: var(--washi);
        line-height: 1;
      }
      .body { display: flex; flex-direction: column; gap: 22px; }
      .eyebrow {
        font-family: 'Consolas', 'DM Mono', monospace;
        font-size: 24px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--kaki-deep);
      }
      h1 {
        font-size: 88px;
        line-height: 1.02;
        font-weight: 500;
      }
      h1 .accent { font-style: italic; color: var(--kaki-deep); }
      .tagline {
        font-size: 30px;
        line-height: 1.35;
        color: var(--ink-soft);
        max-width: 720px;
      }
      .foot {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 24px;
        font-family: 'Consolas', 'DM Mono', monospace;
        font-size: 22px;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--kaki); }
      .rule { width: 84px; height: 3px; background: var(--kaki); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="seal"><span>渋</span></div>
    <div class="body">
      <div class="eyebrow">Programador Front-End Senior</div>
      <h1>Alejandro<br /><span class="accent">Borbalán Dueñas</span></h1>
      <div class="rule"></div>
      <p class="tagline">
        +7 años de frontend Angular a escala — librerías, arquitectura de componentes
        y código donde el diseño importa tanto como la estructura.
      </p>
      <div class="foot">
        <span>shibui-cv.web.app</span>
        <span class="dot"></span>
        <span>github.com/aborbalan</span>
      </div>
    </div>
  </body>
</html>
