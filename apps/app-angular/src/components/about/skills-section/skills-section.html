<section class="skills-section">
  <div class="section-header">
    <lib-eyebrow color="dark" size="sm" class="eyebrow">Skills · Stack técnico</lib-eyebrow>
    <h2 class="section-title">
      Herramientas <em>del oficio</em>
    </h2>
  </div>

  <div class="skills-grid">
    @for (group of skillGroups(); track group.category) {
      <div class="skill-group">
        <div class="group-header">
          <span class="group-kanji">{{ getKanji(group.category) }}</span>
          <span class="group-label">{{ group.label }}</span>
        </div>
        <div class="skill-badges">
          @for (skill of sortedSkills(group); track skill.id) {
            <lib-badge [variant]="getVariant(group.category)">{{ skill.name }}</lib-badge>
          }
        </div>
      </div>
    }
  </div>
</section>
