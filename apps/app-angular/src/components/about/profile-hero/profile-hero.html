<section class="profile-hero">
  <!-- Avatar column -->
  <div class="avatar-col">
    <div class="avatar-wrapper">
      <lib-avatar
        [name]="profile().name"
        size="xl"
        shape="squircle"
        style="--lib-avatar-size: 96px"
      ></lib-avatar>
      @if (openToWork()) {
        <div class="open-indicator"></div>
      }
    </div>

    <div class="social-links">
      @for (social of profile().socials; track social.label) {
        <lib-button variant="ghost" size="sm" (uiLibClick)="openUrl(social.url)">
          <span class="social-label">{{ social.label }}</span>
        </lib-button>
      }
    </div>
  </div>

  <!-- Content column -->
  <div class="content-col">
    <div class="eyebrow-row">
      <lib-eyebrow color="celadon" size="sm" class="eyebrow">Perfil · About Me</lib-eyebrow>
      @if (openToWork()) {
        <lib-badge variant="success" dot>Open to Work</lib-badge>
      }
    </div>

    <lib-display-heading
      tag="h1"
      size="md"
      surface="dark"
      [line1]="profile().name"
      [accent]="profile().title"
    ></lib-display-heading>

    <div class="location">
      <span class="location-icon">⌖</span>
      <span class="location-text">{{ profile().location }}</span>
    </div>

    <p class="bio">{{ profile().bio }}</p>

    <a class="email-link" [href]="'mailto:' + profile().email">{{ profile().email }}</a>
  </div>
</section>
