<lib-card
  class="component-card"
  clickable
  (click)="onSelect()"
  (keydown.enter)="onSelect()"
>
  <lib-badge slot="tag" [tone]="statusTone()" size="sm" pill>
    {{ component().status }}
  </lib-badge>

  <h3 slot="title" class="card-name">{{ component().name }}</h3>

  @if (component().description) {
    <p class="card-description">{{ component().description }}</p>
  }

  @if (component().tags.length > 0) {
    <div class="card-tags">
      @for (tag of component().tags.slice(0, 3); track tag) {
        <lib-badge tone="neutral" size="sm">{{ tag }}</lib-badge>
      }
    </div>
  }

  <span slot="footer" class="tag-name">{{ component().tagName }}</span>
</lib-card>
