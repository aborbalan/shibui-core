<lib-background variant="ash-grid">
  <div class="login-wrapper">
    <div class="card-wrapper" [class.is-shaking]="shake()">
      <lib-glass-card variant="kaki" intensity="high">
        <form class="login-form" (submit)="handleSubmit($event)">

          <div class="text-part">
            <span class="kanji">渋</span>
            <span class="access-message">admin · acceso restringido</span>
          </div>

          <lib-input
            type="password"
            label="Contraseña"
            placeholder="••••••••••"
            [value]="password()"
            [error]="error()"
            errorMessage="Contraseña incorrecta"
            (uiLibInput)="password.set($event.detail.value); error.set(false)"
          ></lib-input>

          <lib-button variant="primary" (uiLibClick)="handleSubmit()">
            Entrar
          </lib-button>

        </form>
      </lib-glass-card>
    </div>
  </div>
</lib-background>
