name: Release — npm Publish

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Ref del branch que disparó el orquestador"
        type: string
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "9.15.0"

jobs:
  release:
    name: 🚀 Semantic Release + npm Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # ← requerido por npm Trusted Publishers (OIDC)
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          # ⚠️ Sin registry-url: si se incluye, setup-node escribe
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} en .npmrc.
          # Con NODE_AUTH_TOKEN vacío esa línea rompe el flujo OIDC de
          # Trusted Publishers y el registry devuelve 404 en lugar de 401.

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: 🏗️ Build UI lib (versión bumpeada)
        run: pnpm --filter @shibui-ui/ui build

      - name: 📦 Publish to npm (OIDC Provenance)
        working-directory: packages/shibui-ui
        run: npm publish --provenance --access public