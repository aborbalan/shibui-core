name: CI — Apps

on:
  workflow_call:
    inputs:
      ui:
        type: string
        required: true
      react:
        type: string
        required: true
      angular:
        type: string
        required: true
      svelte:
        type: string
        required: true
      cv:
        type: string
        required: true
      ref:
        type: string
        required: true

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "9.15.0"

jobs:
  build-react:
    name: 📦 Build React App
    runs-on: ubuntu-latest
    if: inputs.react == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build UI lib (peer dependency)
        run: pnpm --filter @shibui-ui/ui build
      - name: 📦 Build React App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm --filter app-react build
      - name: 📤 Upload React dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-${{ github.run_id }}
          path: apps/app-react/dist/
          retention-days: 1

  build-angular:
    name: 📦 Build Angular App
    runs-on: ubuntu-latest
    if: inputs.angular == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build UI lib (peer dependency)
        run: pnpm --filter @shibui-ui/ui build
      - name: 📦 Build Angular App
        run: pnpm --filter app-angular build
      - name: 📤 Upload Angular dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist-${{ github.run_id }}
          path: apps/app-angular/dist/
          retention-days: 1

  build-svelte:
    name: 📦 Build Svelte App
    runs-on: ubuntu-latest
    if: inputs.svelte == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build UI lib (peer dependency)
        run: pnpm --filter @shibui-ui/ui build
      - name: 📦 Build Svelte App
        run: pnpm --filter app-svelte build
      - name: 📤 Upload Svelte dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: svelte-dist-${{ github.run_id }}
          path: apps/app-svelte/dist/
          retention-days: 1

  build-cv:
    name: 📦 Build CV App
    runs-on: ubuntu-latest
    if: inputs.cv == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build UI lib (peer dependency)
        run: pnpm --filter @shibui-ui/ui build
      - name: 📦 Build CV App
        run: pnpm --filter app-cv build
      - name: 📤 Upload CV dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-dist-${{ github.run_id }}
          path: apps/app-cv/dist/
          retention-days: 1

  deploy-apps:
    name: 🚀 Deploy Apps to Firebase
    runs-on: ubuntu-latest
    needs: [build-react, build-angular, build-svelte, build-cv]
    if: |
      always() &&
      (inputs.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/develop') &&
      needs.build-react.result != 'failure' &&
      needs.build-angular.result != 'failure' &&
      needs.build-svelte.result != 'failure' &&
      needs.build-cv.result != 'failure'
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🔧 Copy .firebaserc to config dir
        run: cp .firebaserc .config/.firebaserc
      - name: 📥 Download React dist artifact
        if: needs.build-react.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: react-dist-${{ github.run_id }}
          path: apps/app-react/dist/
      - name: 🚀 Deploy React App
        if: needs.build-react.result == 'success'
        run: pnpm exec firebase deploy --only hosting:react --non-interactive --project lib-ui-b67c5
      - name: 📥 Download Angular dist artifact
        if: needs.build-angular.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: angular-dist-${{ github.run_id }}
          path: apps/app-angular/dist/
      - name: 🚀 Deploy Angular App
        if: needs.build-angular.result == 'success'
        run: pnpm exec firebase deploy --only hosting:angular --non-interactive --project lib-ui-b67c5
      - name: 📥 Download Svelte dist artifact
        if: needs.build-svelte.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: svelte-dist-${{ github.run_id }}
          path: apps/app-svelte/dist/
      - name: 🚀 Deploy Svelte App
        if: needs.build-svelte.result == 'success'
        run: pnpm exec firebase deploy --only hosting:svelte --non-interactive --project lib-ui-b67c5
      - name: 📥 Download CV dist artifact
        if: needs.build-cv.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cv-dist-${{ github.run_id }}
          path: apps/app-cv/dist/
      - name: 🚀 Deploy CV App
        if: needs.build-cv.result == 'success'
        run: pnpm exec firebase deploy --only hosting:cv --non-interactive --project lib-ui-b67c5