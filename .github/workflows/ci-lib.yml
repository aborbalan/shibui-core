name: CI — UI Library

on:
  workflow_call:
    inputs:
      ui:
        type: string
        required: true
      # ui_behavior: true cuando cambian ficheros que afectan el contrato observable
      # desde fuera: TypeScript de componentes, tokens katachi/semánticos, o los
      # propios ficheros de consumer-tests. CSS scoped a Shadow DOM queda excluido.
      ui_behavior:
        type: string
        required: false
        default: 'false'
      # event: nombre del evento GitHub que desencadenó el workflow (push,
      # pull_request, workflow_dispatch). Lo usa test-consumers para decidir si corre.
      event:
        type: string
        required: false
        default: 'push'
      ref:
        type: string
        required: true
      # github_issues: 'true' → tras generar el Trust Report, crear/actualizar
      # issues de GitHub (uno por componente sin sello). Opt-in: solo lo pone a
      # 'true' el orchestrator vía workflow_dispatch (force_hanko_issues). Default
      # 'false' → el deploy normal en cada main NO crea issues.
      github_issues:
        type: string
        required: false
        default: 'false'

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "9.15.0"

jobs:
  quality:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🔎 Type Check
        run: pnpm --filter @shibui-ui/ui type-check
      - name: 🧹 Lint
        run: pnpm --filter @shibui-ui/ui lint
      - name: 🎯 Cohesión de props (contrato del DS)
        # Valida que el manifest cumple docs/props-contract.md (C1–C12: size/tone/
        # tint/surface/variant canónicos, danger prohibido, estéticas solo en theme,
        # sin '' ni unknown, defaults válidos). KNOWN_PENDING vacío = DS 100% cohesivo.
        run: pnpm --filter @shibui-ui/ui test:cohesion
      - name: 🧪 Unit tests (extractor wrappers · icon-registry · utils)
        # Suite unitaria completa (vitest). Antes solo corría test:stories, lo que
        # ocultaba drift en el generador de wrappers y en el registro de iconos.
        run: pnpm --filter @shibui-ui/ui test:unit

  build-ui:
    name: 🏗️ Build UI Library
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build Library
        run: pnpm --filter @shibui-ui/ui build
      - name: 🔁 Drift guard — datos de componentes en sync con el manifiesto
        # El build ya corre `analyze` + `generate:components-api`. Si el fichero
        # generado difiere del commiteado, alguien tocó un componente sin regenerar.
        run: |
          git diff --exit-code -- apps/shibui-api/src/domain/components/data/components.generated.ts \
            || { echo "::error::components.generated.ts desactualizado. Corre 'pnpm --filter @shibui-ui/ui generate:components-api' y commitea el resultado."; exit 1; }
      - name: 📤 Upload UI Library dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist-${{ github.run_id }}
          path: packages/shibui-ui/dist/
          retention-days: 1
      - name: 🎡 Build Storybook
        run: pnpm --filter @shibui-ui/ui build-storybook
      - name: 📤 Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ github.run_id }}
          path: packages/shibui-ui/storybook-static/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Hanko · Carril 1 — Correctitud de hanko (gate DURO, independiente de shibui).
  # hanko se valida A SÍ MISMO con fixtures sintéticos: type-check + vitest
  # (node + navegador). NO depende del sellado de ningún consumer (ADR-003):
  # el desarrollo de hanko no puede bloquearse por el drift del CEM de shibui.
  # Requiere @shibui-ui/hanko en el lockfile (pnpm install + commit).
  # ─────────────────────────────────────────────────────────────────────────
  hanko-test:
    name: 判 Hanko — tests propios (type-check · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🔎 Type Check
        run: pnpm --filter @shibui-ui/hanko type-check
      - name: 🧪 Unit tests (node)
        run: pnpm --filter @shibui-ui/hanko test
      - name: 🌐 Install Playwright Chromium
        run: pnpm --filter @shibui-ui/hanko exec playwright install chromium --with-deps
      - name: 🧪 Browser tests (harness sobre elementos sintéticos)
        run: pnpm --filter @shibui-ui/hanko test:browser

  # ─────────────────────────────────────────────────────────────────────────
  # Hanko · Carril 2 (PR) — Gate de REGRESIÓN Floor sobre el CEM de shibui-ui.
  # hanko lee el `custom-elements.json` (artefacto ui-dist) y aplica el Floor
  # del ADR-001 (registrabilidad, node, sin navegador). Gate de regresión: falla
  # solo si un componente que sellaba el Floor en el baseline deja de hacerlo —
  # NO exige conformance plena, así que NO castiga el drift del CEM de shibui
  # (ADR-003). NO importa shibui: se comunica solo por el manifest.
  # Requiere @shibui-ui/hanko en el lockfile (pnpm install + commit).
  # ─────────────────────────────────────────────────────────────────────────
  hanko-seal:
    name: 判 Hanko Trust Seal (Floor · regresión)
    runs-on: ubuntu-latest
    needs: build-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 📥 Download UI Library dist (incluye custom-elements.json)
        uses: actions/download-artifact@v4
        with:
          name: ui-dist-${{ github.run_id }}
          path: packages/shibui-ui/dist/
      - name: 判 Trust Report (Floor · node, sin observaciones de navegador)
        run: pnpm --filter @shibui-ui/hanko report
      - name: 判 Gate de regresión Floor (vs dogfood/baseline.floor.json)
        run: pnpm --filter @shibui-ui/hanko gate:floor

  test-stories:
    name: 🧪 Story Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🌐 Install Playwright Chromium
        run: pnpm --filter @shibui-ui/ui exec playwright install chromium --with-deps
      - name: 🧪 Run Story Tests
        run: pnpm --filter @shibui-ui/ui test:stories
      - name: 🔬 Props Conformance (Nivel 2 — reflect + delta visual)
        # Instancia cada componente en Chromium y verifica que los 7 ejes de
        # cohesión (size/tone/surface/theme/variant/display/tint) reflejan su
        # atributo y que cada opción cambia el render. Caza selectores
        # :host([attr=…]) huérfanos tras los renames que el Nivel 1 no ve.
        run: pnpm --filter @shibui-ui/ui test:conformance
      - name: 🎭 E2E de comportamiento (Playwright)
        # 63 aserciones sobre eventos, foco, ARIA y propagación a través del
        # Shadow DOM: modal, tabs, accordion, drawer, toast-manager, chip,
        # dialog, gadget-frame y el registro de iconos.
        #
        # No corrían en ningún workflow. Al reactivarlas apareció que seis
        # componentes usaban <lib-icon> en su template sin importar el módulo
        # que lo registra, así que el icono no se pintaba. Este paso existe
        # para que eso no vuelva a pasar inadvertido.
        #
        # --project=chromium es obligatorio: el paso de arriba solo instala
        # ese navegador, y el config declara además firefox y webkit.
        # Playwright levanta Storybook solo (webServer en el config).
        run: pnpm --filter @shibui-ui/ui exec playwright test --config .config/playwright.config.js atoms/ molecules/ organisms/ --project=chromium

  # ─────────────────────────────────────────────────────────────────────────
  # Consumer Contract Tests
  # Verifica que @shibui-ui/ui se integra correctamente con React 19,
  # Svelte 5 y Angular 21 como consumidores reales.
  #
  # Necesita build-ui porque los fixtures importan @shibui-ui/ui desde dist/.
  # Corre en paralelo con test-stories (que no necesita dist/).
  #
  # Si falla → run-lib-pipeline.result = 'failure' → release bloqueado.
  #
  # Condición de ejecución (doble filtro):
  #   1. QUÉ cambió: solo si ui_behavior == true (TS de componentes, tokens
  #      katachi/semánticos, o ficheros de consumer-tests). CSS scoped a Shadow
  #      DOM excluido — los tests no validan estilos internos de componentes.
  #   2. EN QUÉ CONTEXTO: solo en PRs, ramas develop/main, o workflow_dispatch
  #      (override manual). En pushes a feature/** o fix/** se omiten para no
  #      penalizar cada commit de desarrollo.
  # ─────────────────────────────────────────────────────────────────────────
  test-consumers:
    name: 🌐 Consumer Contract Tests (React · Svelte · Angular)
    runs-on: ubuntu-latest
    needs: build-ui
    if: |
      inputs.ui_behavior == 'true' &&
      (inputs.event == 'pull_request' ||
       inputs.event == 'workflow_dispatch' ||
       inputs.ref == 'refs/heads/develop' ||
       inputs.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 📥 Download UI Library dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist-${{ github.run_id }}
          path: packages/shibui-ui/dist/
      - name: 🌐 Install Playwright Chromium
        run: pnpm --filter @shibui/consumer-tests exec playwright install chromium --with-deps
      - name: 🧪 Run Consumer Contract Tests
        run: pnpm --filter @shibui/consumer-tests test
      - name: 📤 Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-test-report-${{ github.run_id }}
          path: packages/consumer-tests/playwright-report/
          retention-days: 7

  deploy-storybook:
    name: 🚀 Deploy Storybook
    runs-on: ubuntu-latest
    needs: build-ui
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      (inputs.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/develop')
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 📥 Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static-${{ github.run_id }}
          path: packages/shibui-ui/storybook-static/
      - name: 🚀 Deploy Storybook
        run: pnpm exec firebase deploy --only hosting:storybook --non-interactive --project lib-ui-b67c5

  # ─────────────────────────────────────────────────────────────────────────
  # Hanko Trust Report — F6 incr. 2 (4 capas) + deploy.
  # Genera el Trust Report (JSON + HTML) sobre el CEM de shibui-ui y publica
  # el HTML en hanko-report.web.app — la última versión sellada en main.
  #
  # Dos etapas:
  #   1. `observe` — el harness corre sobre los componentes vivos de shibui en
  #      chromium → observations.json (contrato/a11y/resiliencia).
  #   2. `report`  — Floor estático + esas observaciones → buildTrustReport.
  # Si la sonda fallara, `report` degrada a Floor (otras capas → – por la
  # regla de oro), sin romper el deploy. Solo main: la foto de lo ejecutado allí.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-hanko-report:
    name: 判 Deploy Hanko Trust Report
    runs-on: ubuntu-latest
    needs: build-ui
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      inputs.ref == 'refs/heads/main'
    # issues: write solo se usa si github_issues == 'true' (step opt-in de abajo).
    permissions:
      contents: read
      issues: write
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 📥 Download UI Library dist (incluye custom-elements.json)
        uses: actions/download-artifact@v4
        with:
          name: ui-dist-${{ github.run_id }}
          path: packages/shibui-ui/dist/
      - name: 🌐 Install Playwright Chromium
        run: pnpm --filter @shibui-ui/hanko exec playwright install chromium --with-deps
      - name: 判 Sondear shibui (Etapa 1) — observations.json sobre el dist real
        # El harness de hanko corre sobre los componentes vivos de shibui en
        # chromium y deja observations.json. Si la sonda fallara, el report
        # siguiente degrada a Floor (las otras capas → –), no rompe el deploy.
        run: pnpm --filter @shibui-ui/hanko observe
      - name: 判 Generar Trust Report (Etapa 2) — 4 capas sobre el CEM + observaciones
        run: pnpm --filter @shibui-ui/hanko report
      - name: 判 Assets de la página (shibui-ui.js + tokens.css) — visualización con @shibui/ui
        # El HTML del report usa web components de shibui (sin import en el core):
        # este step deja el bundle de registro + tokens junto al index.html que se
        # despliega. Si fallara, la página degrada a sus colores de fallback.
        run: pnpm --filter @shibui-ui/hanko assets:page
      - name: 📤 Subir trust-report.json (refresco de baseline ante delta de plataforma)
        # Si el gate de 4 capas marcara una regresión espuria por delta Linux↔local,
        # se refresca dogfood/baseline.json desde este artefacto (ver dogfood/BASELINE.md).
        uses: actions/upload-artifact@v4
        with:
          name: hanko-trust-report-${{ github.run_id }}
          path: packages/hanko/hanko-report/trust-report.json
          retention-days: 7
      # Opt-in: convierte los componentes sin sello en issues de GitHub (idempotente:
      # crea/actualiza/cierra). Solo cuando se lanza a mano con force_hanko_issues.
      - name: 判 Crear/actualizar issues de hanko (opt-in)
        if: inputs.github_issues == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm --filter @shibui-ui/hanko issues
      - name: 🚀 Deploy Trust Report → hanko-report.web.app
        run: pnpm exec firebase deploy --only hosting:hanko-report --non-interactive --project lib-ui-b67c5
      - name: 判 Gate de regresión (4 capas) — falla si un sello del baseline se cae
        # Último paso: el report ya se publicó y el artefacto ya subió, así que una
        # regresión deja rastro inspeccionable aunque el job acabe en rojo. Gate de
        # regresión per-tag vs dogfood/baseline.json (ADR-003): el drift preexistente
        # del CEM de shibui está congelado en el baseline → no rompe el build.
        run: pnpm --filter @shibui-ui/hanko gate