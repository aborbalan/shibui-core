name: Orchestrator — Shibui Ecosystem

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:                    # ← trigger manual desde GitHub UI
    inputs:
      force_ui:
        description: "Forzar pipeline UI & Storybook"
        type: boolean
        default: false
      force_react:
        description: "Forzar pipeline React App"
        type: boolean
        default: false
      force_angular:
        description: "Forzar pipeline Angular App"
        type: boolean
        default: false
      force_svelte:
        description: "Forzar pipeline Svelte App"
        type: boolean
        default: false
      force_cv:
        description: "Forzar pipeline CV App"
        type: boolean
        default: false
      force_opencells:
        description: "Forzar pipeline Open Cells App (Cockpit)"
        type: boolean
        default: false
      force_api:
        description: "Forzar pipeline API"
        type: boolean
        default: false
      force_tauri:
        description: "Forzar pipeline Tauri Rust Core"
        type: boolean
        default: false
      force_sukashi:
        description: "Forzar pipeline Sukashi"
        type: boolean
        default: false
      force_hanko_issues:
        description: "判 Crear/actualizar issues de GitHub desde el Trust Report de hanko (solo main)"
        type: boolean
        default: false

# Un único punto de cancelación para todo el ecosistema
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────
# JOB 1 — Detección de cambios
# Única fuente de verdad sobre qué ha cambiado.
# Sus outputs son la API pública hacia los pipelines.
# ─────────────────────────────────────────
jobs:
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ui:          ${{ steps.resolve.outputs.ui }}
      ui_behavior: ${{ steps.resolve.outputs.ui_behavior }}
      react:       ${{ steps.resolve.outputs.react }}
      angular:     ${{ steps.resolve.outputs.angular }}
      svelte:      ${{ steps.resolve.outputs.svelte }}
      cv:          ${{ steps.resolve.outputs.cv }}
      opencells:   ${{ steps.resolve.outputs.opencells }}
      api:         ${{ steps.resolve.outputs.api }}
      tauri:       ${{ steps.resolve.outputs.tauri }}
      sukashi:     ${{ steps.resolve.outputs.sukashi }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/shibui-ui/**'
              - 'packages/hanko/**'
              - 'packages/consumer-tests/**'
              - 'packages/consumer-tests-angular/**'
            # ui_behavior: cambios que afectan el CONTRATO observable desde fuera
            # (TypeScript de componentes, tokens katachi/semánticos, fixtures de tests).
            # CSS de componentes scoped a Shadow DOM queda excluido adrede:
            # los consumer tests no validan estilos internos de componentes.
            ui_behavior:
              - 'packages/shibui-ui/src/**/*.ts'
              - 'packages/shibui-ui/src/styles/shared/tokens/_katachi.css'
              - 'packages/shibui-ui/src/styles/shared/tokens/_semantic.css'
              - 'packages/consumer-tests/**'
              - 'packages/consumer-tests-angular/**'
            react:   'apps/app-react/**'
            angular: 'apps/app-angular/**'
            svelte:  'apps/app-svelte/**'
            cv:      'apps/app-cv/**'
            opencells: 'apps/app-opencells/**'
            api:     'apps/shibui-api/**'
            tauri:   'apps/app-tauri/**'
            sukashi: 'packages/sukashi/**'

      # OR lógico: cambio detectado ó forzado manualmente
      - name: 🎛️ Resolve outputs (auto + manual override)
        id: resolve
        run: |
          echo "ui=$([[ '${{ steps.filter.outputs.ui }}' == 'true' || '${{ inputs.force_ui }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "ui_behavior=$([[ '${{ steps.filter.outputs.ui_behavior }}' == 'true' || '${{ inputs.force_ui }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "react=$([[ '${{ steps.filter.outputs.react }}' == 'true' || '${{ inputs.force_react }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "angular=$([[ '${{ steps.filter.outputs.angular }}' == 'true' || '${{ inputs.force_angular }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "svelte=$([[ '${{ steps.filter.outputs.svelte }}' == 'true' || '${{ inputs.force_svelte }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "cv=$([[ '${{ steps.filter.outputs.cv }}' == 'true' || '${{ inputs.force_cv }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "opencells=$([[ '${{ steps.filter.outputs.opencells }}' == 'true' || '${{ inputs.force_opencells }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "api=$([[ '${{ steps.filter.outputs.api }}' == 'true' || '${{ inputs.force_api }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "tauri=$([[ '${{ steps.filter.outputs.tauri }}' == 'true' || '${{ inputs.force_tauri }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "sukashi=$([[ '${{ steps.filter.outputs.sukashi }}' == 'true' || '${{ inputs.force_sukashi }}' == 'true' ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────
  # JOB 2 — Pipeline UI & Apps
  # Se activa si cambia cualquier parte del frontend.
  # ─────────────────────────────────────────
  run-lib-pipeline:
    name: 📦 UI Library Pipeline
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true'
    # Techo de permisos para el reusable: un workflow llamado no puede obtener más
    # que su caller. issues:write habilita el step opt-in de issues de hanko sin
    # depender del permiso por defecto del repo (que podría ser read-only).
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/ci-lib.yml
    with:
      ui:            ${{ needs.detect-changes.outputs.ui }}
      ui_behavior:   ${{ needs.detect-changes.outputs.ui_behavior }}
      event:         ${{ github.event_name }}
      ref:           ${{ github.ref }}
      # Opt-in manual: solo crea issues si se lanza el orchestrator a mano con el flag.
      github_issues: ${{ inputs.force_hanko_issues == true && 'true' || 'false' }}
    secrets: inherit

  run-apps-pipeline:
    name: 🖥️ Apps Pipeline
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ui == 'true' ||
      needs.detect-changes.outputs.react == 'true' ||
      needs.detect-changes.outputs.angular == 'true' ||
      needs.detect-changes.outputs.svelte == 'true' ||
      needs.detect-changes.outputs.cv == 'true' ||
      needs.detect-changes.outputs.opencells == 'true'
    uses: ./.github/workflows/ci-apps.yml
    with:
      ui:        ${{ needs.detect-changes.outputs.ui }}
      react:     ${{ needs.detect-changes.outputs.react }}
      angular:   ${{ needs.detect-changes.outputs.angular }}
      svelte:    ${{ needs.detect-changes.outputs.svelte }}
      cv:        ${{ needs.detect-changes.outputs.cv }}
      opencells: ${{ needs.detect-changes.outputs.opencells }}
      ref: ${{ github.ref }}
    secrets: inherit

  run-release:
    name: 🚀 Release Pipeline
    needs: [detect-changes, run-lib-pipeline]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.ui == 'true' &&
      needs.run-lib-pipeline.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  # ─────────────────────────────────────────
  # JOB 3 — Pipeline API
  # Se activa solo si cambia la API.
  # No corre en feature/** — ver triggers de este fichero
  # vs el if de aquí abajo para afinar más si hace falta.
  # ─────────────────────────────────────────
  run-api-pipeline:
    name: 🔌 API Pipeline
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  # ─────────────────────────────────────────
  # JOB 4 — Pipeline Tauri Rust Core
  # Valida fmt, clippy y tests de la crate `core/`.
  # No requiere system deps de Tauri (webkit2gtk etc.).
  # ─────────────────────────────────────────
  run-tauri-pipeline:
    name: 🦀 Tauri Rust Core Pipeline
    needs: detect-changes
    if: needs.detect-changes.outputs.tauri == 'true'
    uses: ./.github/workflows/ci-tauri.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  # ─────────────────────────────────────────
  # JOB 5 — Pipeline Sukashi
  # type-check + tests en cada cambio de packages/sukashi/**.
  # Deploy de la web de demo (sukashi.web.app) solo en main.
  # ─────────────────────────────────────────
  run-sukashi-pipeline:
    name: 透 Sukashi Pipeline
    needs: detect-changes
    if: needs.detect-changes.outputs.sukashi == 'true'
    uses: ./.github/workflows/ci-sukashi.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

